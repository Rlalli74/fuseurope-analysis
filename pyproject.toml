[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuseurope-analysis"
version = "1.0.0"
description = "Shared reproducibility pipeline for the two final FusEurope fusion-history articles"
authors = [{name = "Roberto Lalli"}]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "networkx>=3.4",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "nbformat>=5.10", "nbclient>=0.10"]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
